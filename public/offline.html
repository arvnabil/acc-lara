<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#003599">
  <title>Accommerce.id — Offline</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8f9fa; color: #0b1c30; }
    main { max-width: 420px; margin: 24px; padding: 32px; text-align: center; background: #fff; border: 1px solid #dbe3ef; border-radius: 16px; box-shadow: 0 8px 24px rgba(11,28,48,.08); }
    img { width: 150px; height: auto; margin-bottom: 20px; }
    h1 { color: #003599; font-size: 24px; margin: 0 0 12px; }
    p { line-height: 1.5; color: #52627a; }
    a { display: inline-block; margin-top: 12px; padding: 12px 20px; border-radius: 8px; background: #003599; color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="/accommerce-blue.png" alt="Accommerce.id">
    <h1>Koneksi sedang offline</h1>
    <p>Halaman ini belum tersedia tanpa koneksi internet. Silakan coba lagi atau kembali ke beranda.</p>
    <a href="/">Kembali ke beranda</a>
  </main>
</body>
</html>
